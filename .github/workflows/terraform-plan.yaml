name: Terraform Plan (PR)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'docker-compose.yml'
      - '.github/workflows/terraform-plan.yaml'

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate deployment package
        run: zip deploy.zip docker-compose.yml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=multi-docker/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -no-color
        env:
          TF_VAR_Terra_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_Terra_eb_app_name: ${{ vars.EB_APP_NAME }}
          TF_VAR_Terra_eb_env_name: ${{ vars.EB_ENV_NAME }}
          TF_VAR_Terra_version_label: ${{ github.sha }}
          TF_VAR_Terra_deploy_package_path: ${{ github.workspace }}/deploy.zip
          TF_VAR_Terra_state_bucket: ${{ vars.TF_STATE_BUCKET }}
